name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 22:30 运行 = 北京时间次日 06:30
    - cron: '30 22 * * *'

  # 允许手动运行
  workflow_dispatch:

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      # --------------------------------------------------
      # KataBump 续期
      # --------------------------------------------------

      - name: 🚀 运行续期脚本
        id: renew
        continue-on-error: true
        env:
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python3 app.py

      # --------------------------------------------------
      # Bark 通知
      # --------------------------------------------------

      - name: 🔔 Bark 成功通知
        if: steps.renew.outcome == 'success'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          curl -s -X POST "https://api.day.app/${BARK_KEY}" \
            -d "title=✅ KataBump 自动续期" \
            -d "body=续期任务执行成功%0A时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" \
            -d "group=KataBump" \
            -d "ttl=600"

      - name: 🔔 Bark 失败通知
        if: steps.renew.outcome == 'failure'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          curl -s -X POST "https://api.day.app/${BARK_KEY}" \
            -d "title=❌ KataBump 自动续期失败" \
            -d "body=续期脚本执行失败，请打开 GitHub Actions 查看日志。%0A时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" \
            -d "group=KataBump" \
            -d "ttl=600"

      # --------------------------------------------------
      # 更新时间，避免 GitHub 长期无提交暂停 Actions
      # --------------------------------------------------

      - name: 🕒 更新运行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt

          git add time.txt

          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

      # --------------------------------------------------
      # 清理旧 Actions 运行记录
      # --------------------------------------------------

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          count=0

          for run_id in $runs; do
            count=$((count + 1))

            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete "$run_id" || true
            fi
          done

      # 如果续期脚本失败，让整个 GitHub Actions 最终显示红色
      - name: ❌ 标记续期失败
        if: steps.renew.outcome == 'failure'
        run: |
          echo "KataBump renew failed"
          exit 1
